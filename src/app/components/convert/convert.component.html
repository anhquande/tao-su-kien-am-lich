<mat-card class="card">
  <h1>Âm Lịch → Google Calendar (Multi-Year ICS)</h1>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Danh sách ngày âm</mat-label>
    <textarea matInput rows="8" [(ngModel)]="input" ></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Năm bắt đầu</mat-label>
    <input matInput type="number" [(ngModel)]="startYear" >
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Năm kết thúc (tùy chọn)</mat-label>
    <input matInput type="number" [(ngModel)]="endYear">
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="generateICS()" [disabled]="loading()">
    {{ loading() ? 'Đang tạo...' : 'Tạo file ICS' }}
  </button>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
</mat-card>

@if (previews().length > 0) {
  <mat-card class="card preview">
    <h2>Preview (Dương Lịch)</h2>
    <mat-list>
      @for (v of previews(); track $index) {
        <mat-list-item>
          <div matListItemTitle>{{$index + 1}}. {{ v.title }}</div>
          <div matListItemLine>{{ v.solarDate }}</div>
        </mat-list-item>
      }
    </mat-list>
  </mat-card>
}
